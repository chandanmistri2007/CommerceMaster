rded as expense","Ignored","Shown as asset","Added to capital"],a:1,why:"Only cash payments are recorded."},{ch:3,q:"Companies in India must keep books on",o:["Cash basis","Accrual basis","Hybrid basis","Any basis"],a:1,why:"Section 128 of the Companies Act, 2013."},{ch:3,q:"Fees received \u20B980,000 include \u20B95,000 for next year; fees outstanding \u20B97,000. Fee income on accrual basis is",o:["\u20B980,000","\u20B982,000","\u20B978,000","\u20B992,000"],a:1,why:"80,000 \u2212 5,000 + 7,000 = 82,000."},{ch:3,q:"Depreciation appears under",o:["Cash basis only","Accrual basis only","Both","Neither"],a:1,why:"It is a non-cash expense."},{ch:4,q:"Which is NOT a fundamental accounting assumption under AS 1?",o:["Going concern","Consistency","Prudence","Accrual"],a:2,why:"Prudence is a consideration in selecting policies."},{ch:4,q:"Stock valued at cost or market price, whichever is lower, follows",o:["Consistency","Conservatism","Materiality","Entity"],a:1,why:"Anticipate no profit, provide for all losses."},{ch:4,q:"Fixed assets are shown at cost less depreciation because of",o:["Money measurement","Going concern","Realisation","Periodicity"],a:1,why:"The business is not expected to be wound up."},{ch:4,q:"Capital is treated as a liability of the business because of",o:["Dual aspect","Business entity","Cost","Accrual"],a:1,why:"The business is separate from the owner."},{ch:4,q:"Revenue is recognised when goods are delivered \u2014 this is the",o:["Matching concept","Realisation concept","Cost concept","Consistency convention"],a:1,why:"Realisation: revenue is earned on delivery."},{ch:4,q:"Charging a \u20B950 calculator to expense rather than as an asset follows",o:["Materiality","Disclosure","Consistency","Going concern"],a:0,why:"Immaterial items may be treated simply."},{ch:5,q:"Under AS 9, dividend income is recognised when",o:["Dividend is declared and right to receive established","Cash is received","Profit is earned by investee","Shares are bought"],a:0,why:"When the owner\u2019s right to receive payment is established."},{ch:5,q:"Revenue on sale on approval is recognised when",o:["Goods are dispatched","Buyer accepts or the period lapses","Invoice is prepared","Cash is received"],a:1,why:"That is when risks and rewards pass."},{ch:5,q:"GST collected on sales is",o:["Revenue","Not revenue","Capital receipt","Other income"],a:1,why:"Amounts collected for third parties are excluded."},{ch:5,q:"Ind AS 115 recognises revenue on transfer of",o:["Risk","Title","Control","Cash"],a:2,why:"Control-based model."},{ch:5,q:"Interest income is recognised on",o:["Cash basis","Time-proportion basis","Completion basis","Declaration"],a:1,why:"AS 9."},{ch:6,q:"Cost \u20B9150, NRV \u20B9140. Value under AS 2 is",o:["\u20B9150","\u20B9145","\u20B9140","\u20B9290"],a:2,why:"Lower of cost and NRV."},{ch:6,q:"Which cost formula is NOT permitted by AS 2 (Revised)?",o:["FIFO","Weighted average","LIFO","Specific identification"],a:2,why:"LIFO is not allowed."},{ch:6,q:"Selling price \u20B9500, cost to complete \u20B940, selling cost \u20B920. NRV is",o:["\u20B9500","\u20B9460","\u20B9440","\u20B9480"],a:2,why:"500 \u2212 40 \u2212 20."},{ch:6,q:"In rising prices, FIFO gives closing stock that is",o:["Lowest","Highest","Same as LIFO","Zero"],a:1,why:"Closing stock is at latest prices."},{ch:6,q:"Which is included in the cost of inventory?",o:["Abnormal wastage","Selling expenses","Freight inwards","Admin overheads"],a:2,why:"Costs to bring goods to present location are included."},{ch:6,q:"Overvaluation of closing stock this year will",o:["Understate this year\u2019s profit","Overstate this year\u2019s profit and understate next year\u2019s","Have no effect","Overstate both years"],a:1,why:"Closing stock becomes next year\u2019s opening stock."},{ch:7,q:"Under WDV, the annual depreciation charge",o:["Is constant","Increases","Decreases","Is zero"],a:2,why:"Fixed rate on a falling balance."},{ch:7,q:"A change in depreciation method under revised AS 10 is a",o:["Change in policy","Change in estimate","Prior period item","Extraordinary item"],a:1,why:"Applied prospectively under AS 5."},{ch:7,q:"Machine \u20B91,00,000, scrap \u20B910,000, life 9 years. SLM depreciation p.a. is",o:["\u20B911,111","\u20B910,000","\u20B99,000","\u20B912,000"],a:1,why:"(1,00,000 \u2212 10,000) \xF7 9."},{ch:7,q:"Installation charges of a new machine are",o:["Revenue expenditure","Added to machine cost","Charged to P&L","Deferred"],a:1,why:"Cost to make the asset ready for use."},{ch:7,q:"Depreciation is a process of",o:["Valuation","Allocation of cost","Creating a fund","Revaluation"],a:1,why:"AS 10 \u2014 systematic allocation."},{ch:7,q:"Under the provision method, the asset account shows",o:["Written down value","Original cost","Market value","Scrap value"],a:1,why:"Accumulated depreciation sits in a separate account."},{ch:8,q:"Provision for doubtful debts is",o:["Appropriation of profit","Charge against profit","Capital reserve","Liability to owner"],a:1,why:"Provisions are charges."},{ch:8,q:"Profit on sale of a fixed asset is credited to",o:["General reserve","Capital reserve","Secret reserve","Provision"],a:1,why:"Capital profit."},{ch:8,q:"A reserve can be created only when there is",o:["Loss","Profit","Cash","Bank overdraft"],a:1,why:"It is an appropriation of profit."},{ch:8,q:"Excessive depreciation creates a",o:["General reserve","Specific reserve","Secret reserve","Capital reserve"],a:2,why:"Assets are understated."},{ch:9,q:"Debtors \u20B950,000; further bad debts \u20B92,000; provision 5%. New provision =",o:["\u20B92,500","\u20B92,400","\u20B92,600","\u20B92,000"],a:1,why:"5% of 48,000."},{ch:9,q:"Bad debts recovered are credited to",o:["Debtor\u2019s account","Bad Debts Recovered A/c","Provision A/c","Capital A/c"],a:1,why:"The debtor\u2019s account was already closed."},{ch:9,q:"Bad debts \u20B93,000; new provision \u20B94,000; old provision \u20B95,000. Net P&L charge =",o:["\u20B92,000","\u20B97,000","\u20B912,000","\u20B91,000"],a:0,why:"3,000 + 4,000 \u2212 5,000."},{ch:9,q:"Provision for discount on debtors is calculated on",o:["Total debtors","Debtors after bad debts and provision for doubtful debts","Sales","Creditors"],a:1,why:"Discount is allowed only on good debts likely to be paid."},{ch:10,q:"Wages paid for installation of a new machine are",o:["Revenue expenditure","Capital expenditure","Deferred revenue","Capital receipt"],a:1,why:"Part of the machine\u2019s cost."},{ch:10,q:"Repairs to a building are",o:["Capital expenditure","Revenue expenditure","Capital receipt","Revenue receipt"],a:1,why:"They maintain the asset."},{ch:10,q:"Sale proceeds of old furniture are a",o:["Revenue receipt","Capital receipt","Revenue expenditure","Liability"],a:1,why:"Sale of a fixed asset."},{ch:10,q:"Treating capital expenditure as revenue will",o:["Overstate profit","Understate profit","Not affect profit","Overstate assets"],a:1,why:"Expenses rise and assets fall."},{ch:11,q:"Net profit before manager\u2019s commission \u20B91,10,000. Commission 10% on profit after charging it =",o:["\u20B911,000","\u20B910,000","\u20B912,100","\u20B99,000"],a:1,why:"1,10,000 \xD7 10 \xF7 110."},{ch:11,q:"Prepaid insurance appears in the Balance Sheet as",o:["Liability","Asset","Capital","Not shown"],a:1,why:"Benefit receivable next year."},{ch:11,q:"Free samples distributed are deducted from",o:["Sales","Purchases","Stock","Capital"],a:1,why:"Advertisement A/c Dr / To Purchases A/c."},{ch:11,q:"Goods costing \u20B98,000 lost by fire; claim admitted \u20B95,000. Charge to P&L is",o:["\u20B98,000","\u20B95,000","\u20B93,000","\u20B913,000"],a:2,why:"Only the uninsured part."},{ch:11,q:"Interest on capital is",o:["Income of the business","Expense of the business and added to capital","Deducted from capital","Ignored"],a:1,why:"P&L debit, capital credit."},{ch:12,q:"Purchase of furniture debited to Purchases A/c is an error of",o:["Omission","Commission","Principle","Compensating"],a:2,why:"Capital treated as revenue."},{ch:12,q:"Sales book undercast by \u20B91,000 \u2014 rectifying entry is",o:["Sales A/c Dr / To Suspense","Suspense A/c Dr / To Sales A/c","Debtors Dr / To Sales","No entry"],a:1,why:"Sales must be credited more; the other side is Suspense."},{ch:12,q:"Which error does NOT affect the Trial Balance?",o:["Wrong casting","Posting to wrong side","Complete omission","Partial omission"],a:2,why:"Neither side is recorded."},{ch:12,q:"Credit sale of \u20B9500 posted to the credit of customer\u2019s account. Suspense is affected by",o:["\u20B9500","\u20B91,000","Nil","\u20B9250"],a:1,why:"Twice the amount \u2014 wrong side."},{ch:12,q:"Errors in nominal accounts found next year are rectified through",o:["Suspense A/c","Capital A/c","Profit & Loss Adjustment A/c","Trading A/c"],a:2,why:"Nominal accounts are already closed."},{ch:13,q:"ICAI\u2019s Accounting Standards Board was constituted in",o:["1949","1977","1991","2015"],a:1,why:"21st April 1977."},{ch:13,q:"IFRS are issued by",o:["ICAI","IASB","SEBI","FASB"],a:1,why:"International Accounting Standards Board."},{ch:13,q:"Ind AS became mandatory first for companies with net worth of",o:["\u20B9100 crore","\u20B9250 crore","\u20B9500 crore or more","\u20B91,000 crore"],a:2,why:"From 1st April 2016."},{ch:13,q:"In the standard-setting process, comments from the public are invited through",o:["Guidance note","Exposure draft","Announcement","Circular"],a:1,why:"Exposure Draft stage."},{ch:13,q:"Accounting standards for companies are notified by",o:["ICAI","RBI","Central Government","SEBI"],a:2,why:"Under Section 133 of the Companies Act, 2013."},{ch:14,q:"Physical capital maintenance requires measurement at",o:["Historical cost","Current cost","Realisable value","Present value"],a:1,why:"Operating capacity is measured at current cost."},{ch:14,q:"Fair value under Ind AS 113 is an",o:["Entry price","Exit price","Historical price","Replacement price"],a:1,why:"Price received to sell an asset."},{ch:14
