ess assets and help detect errors and fraud.","Supply information to users and meet legal requirements (Companies Act, tax laws)."]},{h:"Users of accounting information",tbl:{head:["User","What they want to know"],rows:[["Owners / investors","Profitability, safety of capital, dividend capacity"],["Management","Costs, efficiency, data for planning and control"],["Lenders and banks","Ability to repay loans and interest"],["Suppliers (creditors)","Short-term solvency \u2014 will they be paid on time?"],["Employees and unions","Stability, capacity to pay wages and bonus"],["Government and tax authorities","Tax assessment, regulation, national statistics"],["Customers","Continuity of supply and after-sales service"],["Public and researchers","Contribution to economy, environment, employment"]]}},{h:"Qualitative characteristics",p:"These are the attributes that make the information in financial statements useful.",pts:["Fundamental (Conceptual Framework, aligned with IASB): Relevance \u2014 the information can change a decision, through predictive or confirmatory value, and includes materiality. Faithful representation \u2014 complete, neutral and free from error.","Enhancing: Comparability (across years and firms), Verifiability (independent observers would agree), Timeliness (available before it loses value), Understandability (clear to a reasonably informed user).","ICAI\u2019s earlier Framework (used with AS) listed four principal characteristics: understandability, relevance, reliability and comparability \u2014 many university answers still use this list."]},{h:"Limitations of accounting",pts:["Records only events measurable in money \u2014 staff skill, morale or reputation are ignored.","Based on historical cost \u2014 ignores changes in price level.","Uses estimates (depreciation, provisions) \u2014 involves personal judgement.","Can be manipulated (window dressing).","Shows past results; does not by itself predict the future."]}]},2:{t:"Basic Double Entry System",sum:"Dual aspect, the accounting equation, rules of debit and credit, and the accounting cycle up to the trial balance.",secs:[{h:"Dual aspect and the accounting equation",p:"Every transaction has two aspects of equal amount \u2014 a benefit received and a benefit given. Recording both aspects keeps the accounting equation always in balance.",f:["Assets = Liabilities + Capital","Capital = Assets \u2212 Liabilities","Closing capital = Opening capital + Profit + Additional capital \u2212 Drawings"],pts:["Assets: resources owned/controlled that will bring future benefit (cash, stock, debtors, machinery).","Liabilities: present obligations to outsiders (creditors, loans, outstanding expenses).","Capital (owner\u2019s equity): owner\u2019s claim = assets \u2212 liabilities.","Revenue: income from ordinary activities (sales, fees, commission received).","Expenses: costs consumed to earn revenue (wages, rent, salary)."]},{h:"Rules of debit and credit",tbl:{head:["Approach","Debit","Credit"],rows:[["Personal account","The receiver","The giver"],["Real account","What comes in","What goes out"],["Nominal account","All expenses and losses","All incomes and gains"],["Modern: Assets / Expenses","Increase","Decrease"],["Modern: Liabilities / Capital / Revenue","Decrease","Increase"]]},pts:["Drawings reduce capital, so Drawings A/c is debited.","Bank is treated as a personal account (a bank is an artificial person).","Purchases, Sales and Returns accounts are subdivisions of the Goods account."]},{h:"The accounting cycle",pts:["Identify the transaction and its source document (voucher).","Record in the Journal (book of original entry) \u2014 with date, accounts, L.F., amounts and narration.","Post to the Ledger (book of final entry) \u2014 each account gets its own page; \u201CTo\u201D on the debit side, \u201CBy\u201D on the credit side.","Balance the accounts and extract a Trial Balance.","Pass adjusting entries and prepare final accounts.","Close nominal accounts and carry forward real and personal balances."]},{h:"Journal, ledger and trial balance",pts:["Compound journal entry: more than one debit or credit in a single entry.","Balancing: the difference between the two sides is written on the smaller side as \u201CBalance c/d\u201D and shown on the opposite side next period as \u201CBalance b/d\u201D.","Trial Balance: a list of ledger balances on a date \u2014 it checks arithmetical accuracy only.","Errors a Trial Balance cannot reveal: complete omission, errors of principle, compensating errors, posting to the wrong account on the correct side, wrong amount in the book of original entry."],j:{title:"Journal format",entries:[{date:"Date",dr:[["Debit Account A/c",i2]],cr:[["Credit Account A/c",i2]],n:"Being the reason for the entry"}]}},{h:"Advantages of the double entry system",pts:["Complete record of both aspects of every transaction.","Arithmetical accuracy can be checked through the Trial Balance.","Profit or loss and financial position can be found.","Helps detect fraud and comparison between years.","Accepted by law and by tax authorities."]}]},3:{t:"Bases of Accounting",sum:"Cash, accrual and mixed (hybrid) bases \u2014 when income and expenses are recorded.",secs:[{h:"Cash basis",p:"Entries are made only when cash is actually received or paid. Outstanding and prepaid items, accrued incomes and income received in advance are ignored. Used by some professionals (doctors, lawyers) and small firms.",pts:["Simple and objective \u2014 no estimates.","Profit is distorted by timing of receipts and payments.","Does not follow the matching concept; not acceptable for companies."]},{h:"Accrual (mercantile) basis",p:"Revenue is recorded when earned and expenses when incurred, whether or not cash has changed hands. It is a fundamental accounting assumption under AS 1, and Section 128 of the Companies Act, 2013 requires companies to keep books on accrual basis and by double entry.",pts:["Gives a true and fair profit for the period.","Requires adjustments for outstanding, prepaid, accrued and advance items.","Involves estimates (provisions, depreciation)."]},{h:"Mixed (hybrid) basis",p:"A combination: for example, expenses on accrual basis but certain incomes (like interest or fees) on cash basis because their collection is uncertain."},{h:"Cash vs accrual \u2014 comparison",tbl:{head:["Basis of difference","Cash basis","Accrual basis"],rows:[["Recording","On receipt or payment of cash","When earned or incurred"],["Outstanding / prepaid items","Ignored","Adjusted"],["Profit","Not true and fair","True and fair"],["Matching concept","Not followed","Followed"],["Legal acceptance","Not allowed for companies","Compulsory for companies"],["Complexity","Simple","Needs estimates and adjustments"]]},f:["Income (accrual) = Cash received \u2212 arrears of earlier years \u2212 advances for next year + outstanding of current year + advance received earlier for current year"]}]},4:{t:"Basic Concepts and Conventions",sum:"The assumptions and rules (GAAP) on which accounts are built.",secs:[{h:"Accounting concepts",tbl:{head:["Concept","Meaning","Example"],rows:[["Business entity","The business is separate from its owner.","Capital is a liability of the business to the owner; personal expenses are drawings."],["Money measurement","Only events expressible in money are recorded.","Death of a key manager is not recorded."],["Going concern","The business will continue for the foreseeable future.","Fixed assets at cost less depreciation, not at break-up value."],["Accounting period (periodicity)","Life is divided into periods, usually one year.","Final accounts every 31st March."],["Cost","Assets are recorded at acquisition cost.","Land bought for \u20B910 lakh stays at \u20B910 lakh even if its market value rises."],["Dual aspect","Every transaction has two equal aspects.","Assets = Liabilities + Capital."],["Realisation","Revenue is recognised when earned (goods delivered / service rendered), not when the order is received.","Advance received is a liability, not income."],["Accrual","Revenue and expenses are recorded when they arise, not when cash moves.","Outstanding salary is an expense of the year."],["Matching","Expenses of a period are matched with the revenue of that period.","Closing stock carried forward; prepaid expenses excluded."]]}},{h:"Accounting conventions",pts:["Consistency \u2014 the same methods are followed year after year so that results are comparable; a change is disclosed with its effect.","Conservatism (prudence) \u2014 anticipate no profit but provide for all foreseeable losses: stock at lower of cost and NRV, provision for doubtful debts.","Materiality \u2014 items that would not influence a user\u2019s decision may be treated simply (e.g., a stapler charged as expense).","Full disclosure \u2014 all significant information is disclosed, including notes and accounting policies."]},{h:"AS 1 \u2014 Disclosure of Accounting Policies",pts:["Fundamental accounting assumptions: Going concern, Consistency, Accrual. If they are followed, no disclosure is needed; if not followed, the fact must be disclosed.","Major considerations in selecting policies: Prudence, Substance over form, Materiality.","All significant accounting policies must be disclosed in one place; a wrong treatment is not cured by disclosure."]}]},5:{t:"Revenue Recognition",sum:"What revenue is and when it may be recognised \u2014 AS 9 and Ind AS 115.",secs:[{h:"Meaning of revenue (AS 9)",p:"Revenue is the gross inflow of cash, receivables or other consideration arising in the course of ordinary activities from the sale of goods, rendering of services, and the use by others of enterprise resources yielding interest, royalties and dividends. Amounts collected for third parties (such as GST) are not revenue."},{h:"Timing of recognition",pts:["Sale of goods: when the seller has transferred the property in the goods (significant risks and rewards of ownership) to the buyer and no significant uncertainty exists about the consideration.","Rendering of services: proportionate completion method or completed service contract method.","Interest: on a time-proportion basis. Royalties: on accrual basis as per the agreement. Dividends: when the owner\u2019s right to receive payment is established.","If ultimate collection is uncertain at the time of sale, recognition is postponed until it becomes reasonably certain.","Special cases: sale on approval \u2014 when the buyer accepts or the approval period lapses; consignment \u2014 when the consignee sells to third parties; instalment sales \u2014 on the date of sale (interest separately over time)."]},{h:"Objective and recognition of expenses",pts:["Objective: report revenue in the correct period so that profit is measured fairly (realisation + matching).","Expenses are recognised when a decrease in future economic benefits (outflow of assets or increase in liabilities) can be measured reliably.","Expenses directly linked to revenue are matched with it (cost of goods sold); others are recognised in the period incurred (salary, rent)."]},{h:"Ind AS 115 \u2014 five-step model",pts:["Step 1: identify the contract with the customer.","Step 2: identify the performance obligations.","Step 3: determine the transaction price.","Step 4: allocate the price to the performance obligations.","Step 5: recognise revenue when (or as) each obligation is satisfied \u2014 i.e., when control passes to the customer."],p:"Ind AS 115 (effective from 1st April 2018 for Ind AS companies) replaces the \u201Crisks and rewards\u201D test with the \u201Ctransfer of control\u201D test."}]},6:{t:"Accounting for Inventories",sum:"Meaning and importance of inventory, AS 2 valuation at the lower of cost and NRV, cost formulas.",secs:[{h:"Meaning and significance",p:"Inventories are assets held for sale in the ordinary course of business, in the process of production for such sale, or as materials and supplies to be consumed in production or rendering of services.",pts:["Closing stock affects the profit of two years \u2014 the current year (closing) and the next (opening).","Overvaluation inflates profit and assets; undervaluation does the opposite.","Correct valuation is needed for a true and fair Balance Sheet and for tax."]},{h:"AS 2 \u2014 Measurement",f:["Inventory value = lower of Cost and Net Realisable Value (item by item)","NRV = Estimated selling price \u2212 Estimated cost of completion \u2212 Estimated selling costs","Cost = Cost of purchase + Cost of conversion + Other costs to bring goods to present location and condition"],pts:["Excluded from cost: abnormal wastage, storage costs (unless necessary in production), administrative overheads not related to production, selling and distribution costs, refundable taxes.","Raw materials are not written down below cost if the finished products in which they will be used are expected to sell at or above cost.","The comparison of cost and NRV is made item by item (or for groups of similar items), never on the total."]},{h:"Cost formulas",tbl:{head:["Method","How issues are priced","Closing stock in rising prices"],rows:[["FIFO","Oldest receipts issued first","At latest (higher) prices \u2014 higher profit"],["Weighted average","At the average rate after each receipt (perpetual)","In between"],["LIFO","Latest receipts issued first","At oldest (lower) prices \u2014 not permitted by AS 2 (Revised)"],["Specific identification","Actual cost of the particular item","Used for non-interchangeable items"]]}},{h:"Periodic vs perpetual inventory and reconciliation",pts:["Periodic: stock is counted only at the end of the period; cost of goods sold is a balancing figure.","Perpetual: stores ledger shows the balance after every receipt and issue; continuous stock-taking verifies it.","Reconciliation of book stock with physical stock explains differences such as goods received but not recorded, goods sent on approval, goods in transit, normal wastage, theft or errors."]}]},7:{t:"Accounting for Fixed Assets & Depreciation",sum:"Nature and measurement of depreciation, SLM and WDV, disposal, change in estimate, and recording methods (AS 10).",secs:[{h:"Nature of depreciation",p:"Depreciation is the systematic allocation of the depreciable amount of an asset over its useful life. It is a process of allocation of cost, not of valuation. The depreciable amount is cost less residual value. AS 10 (Revised) \u201CProperty, Plant and Equipment\u201D now covers depreciation; old AS 6 was withdrawn.",pts:["Causes: wear and tear by use, passage of time, obsolescence (technological change), depletion of natural resources, accidents.","Need: to match cost with revenue, show assets at fair values, retain funds for replacement, and comply with law."]},{h:"Factors in measurement",pts:["Cost of the asset (purchase price + installation + freight + other costs to make it ready).","Estimated useful life (in years or units of output).","Estimated residual (scrap) value.","Expected pattern of consumption of benefits \u2014 decides the method."]},{h:"Methods",f:["SLM depreciation = (Cost \u2212 Residual value) \xF7 Useful life","WDV depreciation = Opening written down value \xD7 Rate","WDV rate = 1 \u2212 (Residual value \xF7 Cost)^(1/n)","Profit / loss on disposal = Net sale proceeds \u2212 Carrying amount on date of sale"],tbl:{head:["Basis","Straight Line Method","Written Down Value Method"],rows:[["Base","Original cost","Book value at the beginning of each year"],["Annual charge","Equal every year","Decreases every year"],["Asset value","Can become zero (or scrap)","Never becomes zero"],["Total charge (dep + repairs)","Rises over the years","Roughly even \u2014 high dep early, high repairs later"],["Suitable for","Patents, leases, furniture","Plant, machinery, vehicles"],["Calculation","Simple","Slightly complex"]]}},{h:"Recording depreciation",pts:["Asset\u2013depreciation method: Depreciation A/c Dr / To Asset A/c; the asset is shown at written down value.","Asset\u2013provision method: Depreciation A/c Dr / To Provision for Depreciation A/c; the asset stays at cost and accumulated depreciation is deducted in the Balance Sheet.","Disposal: charge depreciation up to the date of sale; transfer cost and accumulated depreciation to an Asset Disposal A/c; the balance is profit or loss."],j:{title:"Entries on sale of an asset (provision method)",entries:[{date:"",dr:[["Asset Disposal A/c",i2]],cr:[["Asset A/c",i2]],n:"Being original cost of asset sold transferred"},{date:"",dr:[["Provision for Depreciation A/c",i2]],cr:[["Asset Disposal A/c",i2]],n:"Being accumulated depreciation transferred"},{date:"",dr:[["Bank A/c",i2]],cr:[["Asset Disposal A/c",i2]],n:"Being sale proceeds received"},{date:"",dr:[["Profit & Loss A/c",i2]],cr:[["Asset Disposal A/c",i2]],n:"Being loss on sale transferred"}]}},{h:"Change in estimate and method",pts:["Useful life, residual value and method are reviewed at least at each financial year-end.","Under revised AS 10 a change in method is treated as a change in accounting estimate (AS 5) \u2014 applied prospectively: the remaining carrying amount is depreciated by the new method over the remaining life.","Older textbooks and some exam questions use the retrospective approach (recalculate from the start, adjust the difference) \u2014 follow the question\u2019s instruction and state your assumption."]}]},8:{t:"Reserves and Provisions",sum:"Appropriation of profit vs charge against profit; types and accounting.",secs:[{h:"Meaning",pts:["Provision: an amount charged against profit to provide for a known liability or a diminution in the value of an asset whose amount cannot be determined with substantial accuracy \u2014 e.g., provision for doubtful debts, depreciation, taxation.","Reserve: an appropriation of profit retained in the business to strengthen its financial position or for a specific purpose \u2014 e.g., general reserve, dividend equalisation reserve."]},{h:"Types of reserves",pts:["Revenue reserve: created from revenue profits; available for dividend (general reserve, specific reserves).","Capital reserve: created from capital profits (profit on sale of fixed assets, premium on issue of shares, profit prior to incorporation); generally not available for dividend.","Specific reserve: for a particular purpose (debenture redemption reserve, dividend equalisation).","Secret (hidden) reserve: not shown in the Balance Sheet \u2014 created by excessive depreciation or undervaluing assets; generally not permitted for companies.","Reserve fund: a reserve whose amount is invested outside the business."]},{h:"Reserve vs provision",tbl:{head:["Basis","Provision","Reserve"],rows:[["Nature","Charge against profit","Appropriation of profit"],["Purpose","Meet a known liability or loss","Strengthen finances / future needs"],["When created","Even if there is a loss","Only out of profit"],["Shown in","Deducted from asset or shown as liability","Under Reserves & Surplus (owners\u2019 funds)"],["Dividend","Not available","Revenue reserve available"],["Compulsion","Compulsory (prudence)","Generally discretionary"]]}}]},9:{t:"Provision on Debtors and Creditors",sum:"Bad debts, provision for doubtful debts, provision for discount and bad debts recovered.",secs:[{h:"Key terms",pts:["Bad debts: amounts definitely irrecoverable \u2014 written off to Bad Debts A/c.","Provision for doubtful debts: estimate of likely future bad debts on existing good debtors (prudence).","Provision for discount on debtors: discount likely to be allowed on good debtors.","Bad debts recovered: an income \u2014 Cash Dr / To Bad Debts Recovered A/c (not the debtor\u2019s account).","Reserve for discount on creditors: discount likely to be received \u2014 conflicts with prudence and is rarely used."]},{h:"Calculation order",f:["Good debtors = Debtors \u2212 Further bad debts","New provision for doubtful debts = Rate \xD7 Good debtors","Provision for discount = Rate \xD7 (Good debtors \u2212 Provision for doubtful debts)","Charge to P&L = Bad debts + Further bad debts + New provision \u2212 Old provision"],p:"If the old provision exceeds bad debts + new provision, the excess is written back (credited to P&L)."},{h:"Journal entries",j:{title:"Bad debts and provision",entries:[{date:"",dr:[["Bad Debts A/c",i2]],cr:[["Sundry Debtors A/c",i2]],n:"Being debts written off"},{date:"",dr:[["Provision for Doubtful Debts A/c",i2]],cr:[["Bad Debts A/c",i2]],n:"Being bad debts transferred to provision"},{date:"",dr:[["Profit & Loss A/c",i2]],cr:[["Provision for Doubtful Debts A/c",i2]],n:"Being provision raised to the required level"}]}}]},10:{t:"Capital and Revenue Transactions",sum:"Classifying expenditure and receipts \u2014 and why it matters for profit.",secs:[{h:"Expenditure",tbl:{head:["Type","Meaning","Examples"],rows:[["Capital expenditure","Acquires or improves a fixed asset or increases earning capacity; benefit lasts more than one year.","Purchase of machinery, its freight and installation, building extension, legal fees for buying land"],["Revenue expenditure","Incurred in the normal course to run the business or maintain assets; benefit within the year.","Wages, salary, rent, repairs, depreciation, carriage on goods"],["Deferred revenue expenditure","Revenue in nature but benefit spread over a few years (traditional view).","Heavy advertisement for a new product; current standards usually require such costs to be expensed"]]}},{h:"Receipts and profits",pts:["Capital receipts: not from normal operations \u2014 capital introduced, loans, sale of fixed assets. Shown in Balance Sheet.","Revenue receipts: from normal operations \u2014 sales, commission, interest, rent received. Credited to P&L.","Capital profit (profit on sale of a fixed asset) and capital loss vs revenue profit and loss from trading."]},{h:"Why classification matters",pts:["Treating capital expenditure as revenue understates profit and assets.","Treating revenue expenditure as capital overstates profit and assets.","Test: Does it create or improve an asset with benefits beyond the year? Is it recurring?","Classic exam cases: repairs on second-hand machinery before use (capital); white-washing an old building (revenue); replacing a worn-out part (revenue)."]}]},11:{t:"Adjustment Entries",sum:"Bringing the accounts to the accrual basis before final accounts.",secs:[{h:"Why adjustments?",p:"The Trial Balance contains balances as recorded. Items that belong to the year but are not yet recorded (or recorded but belong to another year) are adjusted so that the final accounts follow the accrual and matching concepts. Every adjustment given outside the Trial Balance is shown at two places in the final accounts."},{h:"Common adjustments",tbl:{head:["Adjustment","Journal entry","Effect 1","Effect 2"],rows:[["Closing stock","Closing Stock A/c Dr / To Trading A/c","Trading A/c (Cr.)","Balance Sheet \u2014 assets"],["Outstanding expense","Expense A/c Dr / To Outstanding Expense A/c","Add to expense","Liabilities"],["Prepaid expense","Prepaid Expense A/c Dr / To Expense A/c","Deduct from expense","Assets"],["Accrued income","Accrued Income A/c Dr / To Income A/c","Add to income","Assets"],["Income received in advance","Income A/c Dr / To Income Received in Advance A/c","Deduct from income","Liabilities"],["Depreciation","Depreciation A/c Dr / To Asset A/c","P&L (Dr.)","Deduct from asset"],["Further bad debts & provision","Bad Debts A/c Dr / To Debtors; P&L Dr / To Provision","P&L (Dr.)","Deduct from debtors"],["Interest on capital","Interest on Capital A/c Dr / To Capital A/c","P&L (Dr.)","Add to capital"],["Interest on drawings","Capital A/c Dr / To Interest on Drawings A/c","P&L (Cr.)","Deduct from capital"],["Goods taken for personal use","Drawings A/c Dr / To Purchases A/c","Deduct from purchases","Add to drawings"],["Free samples","Advertisement A/c Dr / To Purchases A/c","Deduct from purchases","P&L (Dr.)"],["Goods lost by fire (partly insured)","Loss by Fire A/c Dr / To Trading A/c; Insurance Claim A/c + P&L Dr / To Loss by Fire","Trading A/c (Cr.)","P&L (uninsured part) and claim as asset"],["Manager\u2019s commission on profit after charging it","Manager\u2019s Commission A/c Dr / To Outstanding Commission","P&L (Dr.)","Liabilities"]]},f:["Commission on profit after charging = Profit before commission \xD7 Rate \xF7 (100 + Rate)","Commission on profit before charging = Profit \xD7 Rate \xF7 100"]}]},12:{t:"Rectification of Errors",sum:"Types of errors, their effect on the trial balance, suspense account and correction of profit.",secs:[{h:"Types of errors",tbl:{head:["Type","Example","Affects Trial Balance?"],rows:[["Omission \u2014 complete","A credit purchase not recorded at all","No"],["Omission \u2014 partial","Entered in the journal but not posted to one account","Yes"],["Commission \u2014 posting to wrong account (same side)","Payment to Ram debited to Shyam","No"],["Commission \u2014 wrong side / wrong amount / casting / carry forward","Sales book undercast","Yes"],["Principle","Purchase of furniture debited to Purchases A/c","No"],["Compensating","Over-debit in one account offset by over-credit elsewhere","No"]]}},{h:"Stages of rectification",pts:["Before the Trial Balance: one-sided errors are corrected by a direct entry on the correct side of the account concerned (no journal needed).","After the Trial Balance, before final accounts: the difference has been put in Suspense A/c; one-sided errors are rectified through Suspense A/c.","After final accounts (next year): nominal accounts are already closed, so their corrections go through Profit & Loss Adjustment A/c."]},{h:"Suspense account",p:"A temporary account opened to make the Trial Balance agree. When every one-sided error has been rectified, it closes automatically. If errors remain unlocated at the year end, its balance is shown in the Balance Sheet (debit on the assets side, credit on the liabilities side).",j:{title:"Typical rectifying entries",entries:[{date:"",dr:[["Suspense A/c",i2]],cr:[["Sales A/c",i2]],n:"Being sales book undercast now rectified"},{date:"",dr:[["Furniture A/c",i2]],cr:[["Purchases A/c",i2]],n:"Being furniture wrongly debited to Purchases"},{date:"",dr:[["Discount Allowed A/c",i2]],cr:[["Suspense A/c",i2]],n:"Being discount allowed not posted"}]}},{h:"Effect on profit",pts:["Only errors that involve a nominal account (income, expense, purchases, sales, returns, stock) change profit.","Expense under-debited or income over-credited \u2192 profit overstated \u2192 deduct.","Expense over-debited or income under-credited \u2192 profit understated \u2192 add."]}]},13:{t:"Accounting Standards",sum:"What accounting standards are, why they matter, how they are made in India, and IFRS / Ind AS.",secs:[{h:"Concept and benefits",p:"Accounting standards are written policy documents issued by an expert body covering the recognition, measurement, presentation and disclosure of transactions in financial statements.",pts:["Uniformity and comparability between firms and years.","Reduce choice of alternative treatments and scope for manipulation.","Improve credibility and reliability of financial statements.","Help auditors and regulators; assist users in decision making.","Limitations: rigidity, cannot override law, may not suit every situation, cost of compliance for small entities."]},{h:"Standard setting in India",pts:["ICAI constituted the Accounting Standards Board (ASB) on 21st April 1977.","For companies, standards are notified by the Central Government under Section 133 of the Companies Act, 2013, after consultation with the National Financial Reporting Authority (NFRA, set up in 2018). The Companies (Accounting Standards) Rules, 2021 apply to companies not covered by Ind AS.","ICAI\u2019s AS apply to non-corporate entities (sole proprietors, partnership firms, societies) in phases according to their size."]},{h:"Procedure for issuing an Accounting Standard (ICAI)",pts:["ASB identifies the broad areas needing standards.","Study groups prepare a preliminary draft.","Draft circulated to ICAI Council members and specified bodies (MCA, C&AG, SEBI, RBI, CBDT, industry bodies etc.); ASB meets their representatives.","Exposure Draft issued for public comments.","ASB considers comments and finalises the draft; submits it to the ICAI Council.","Council considers it, may modify it in consultation with ASB, and issues the standard; for companies it is then notified by the Central Government."]},{h:"IFRS and the need for a global standard",pts:["IFRS are issued by the International Accounting Standards Board (IASB), which replaced the IASC in 2001.","Need: cross-border investment, multinational groups, listing on foreign exchanges, lower cost of capital, comparability worldwide.","India chose convergence, not adoption: Indian Accounting Standards (Ind AS) were notified through the Companies (Indian Accounting Standards) Rules, 2015 (16th February 2015).","Roadmap: mandatory from 1st April 2016 for companies with net worth of \u20B9500 crore or more; from 1st April 2017 for listed companies and others with net worth of \u20B9250 crore or more."]}]},14:{t:"Introduction to Accounting Theory",sum:"Theory and practice, GAAP, capital maintenance, historical cost and fair value.",secs:[{h:"Accounting theory and its relation with practice",p:"Accounting theory is a logical system of principles that explains existing practice and provides a framework for evaluating and developing new practices. Theory guides practice; practice tests theory. Standards are the bridge between them.",pts:["Approaches: deductive (from objectives and assumptions to rules), inductive (from observed practice to general rules), normative (what should be done), positive (explaining and predicting what is done)."]},{h:"GAAP",p:"Generally Accepted Accounting Principles are the common set of concepts, conventions, rules and procedures accepted by the profession for preparing financial statements. In India, sources include the Companies Act, accounting standards, guidance notes of ICAI and established practice."},{h:"Capital maintenance concepts",pts:["Profit is earned only after the capital at the beginning of the period has been maintained.","Financial capital maintenance: capital is measured in money \u2014 either nominal money units or units of constant purchasing power (adjusted for general inflation).","Physical capital maintenance: capital is the productive (operating) capacity of the business; it requires current cost measurement.","Under historical cost (nominal financial capital), price rises create \u201Cholding gains\u201D that are counted as profit."]},{h:"Limitations of historical cost accounting",pts:["Ignores changes in the value of money \u2014 assets understated, profits overstated in inflation.","Depreciation on old cost is insufficient to replace assets \u2192 erosion of capital if such profits are distributed.","Mixes rupees of different years \u2014 poor comparability.","Overstated profit may lead to higher taxes, dividends and wage demands."]},{h:"Fair value accounting",p:"Fair value (Ind AS 113) is the price that would be received to sell an asset or paid to transfer a liability in an orderly transaction between market participants at the measurement date \u2014 an exit price.",pts:["Hierarchy: Level 1 (quoted prices in active markets), Level 2 (observable inputs), Level 3 (unobservable inputs, models).","Merits: current, relevant values; reflects economic reality.","Demerits: subjectivity at Level 3, volatility in profits, cost of valuation."]}]},15:{t:"Final Accounts of Sole Proprietorship",sum:"Manufacturing, Trading and Profit & Loss Accounts and the Balance Sheet from a trial balance with adjustments.",secs:[{h:"Structure",pts:["Manufacturing A/c (for a manufacturer): finds cost of production \u2014 opening WIP, raw materials consumed, direct wages, factory overheads, less closing WIP and scrap.","Trading A/c: finds Gross Profit \u2014 sales less cost of goods sold.","Profit & Loss A/c: finds Net Profit \u2014 gross profit plus other income less indirect expenses.","Balance Sheet: statement of assets and liabilities on the last day of the year."],f:["Raw materials consumed = Opening stock + Purchases \u2212 Returns \u2212 Closing stock","Cost of goods sold = Opening stock + Net purchases + Direct expenses \u2212 Closing stock","Gross profit = Net sales \u2212 Cost of goods sold","Net profit = Gross profit + Other income \u2212 Indirect expenses"]},{h:"Where items go",tbl:{head:["Trading A/c (debit)","Profit & Loss A/c (debit)","Profit & Loss A/c (credit)"],rows:[["Opening stock","Salaries, rent, insurance","Discount received"],["Purchases less returns","Carriage outwards, advertisement","Commission received"],["Wages, carriage inwards, freight, octroi","Bad debts, provision, depreciation","Interest received, rent received"],["Fuel and power, factory lighting","Interest on loan, repairs, printing","Profit on sale of assets"],["Royalty on production","Loss by fire (uninsured part)","Bad debts recovered"]]}},{h:"Balance Sheet \u2014 marshalling",pts:["Order of permanence (common for sole traders): fixed assets first, cash last; capital first, current liabilities last.","Order of liquidity: the reverse.","Capital is shown with additions (net profit, interest on capital) and deductions (drawings, interest on drawings, net loss)."]}]},16:{t:"Final Accounts from Incomplete Records / Single Entry",sum:"Ascertaining profit when books are incomplete \u2014 statement of affairs and conversion methods.",secs:[{h:"Meaning and features",p:"Single entry is not a system but an incomplete form of double entry: usually only a cash book and personal accounts of debtors and creditors are kept; real and nominal accounts are not.",pts:["No complete double entry, so no trial balance.","Profit is estimated by comparing capital at two dates.","Used by small traders; not acceptable for companies or for tax purposes in most cases."]},{h:"Statement of Affairs method",f:["Capital = Assets \u2212 Liabilities (from a Statement of Affairs)","Profit = Closing capital + Drawings \u2212 Additional capital \u2212 Opening capital"],tbl:{head:["Basis","Statement of Affairs","Balance Sheet"],rows:[["Records","Incomplete records and estimates","Ledger balances of a double-entry system"],["Capital","Balancing figure","Taken from Capital A/c"],["Reliability","Less reliable","Reliable"],["Omissions","Hard to detect","Trial balance helps detect"]]}},{h:"Conversion method",pts:["Prepare Total Debtors A/c to find credit sales (balancing figure).","Prepare Total Creditors A/c to find credit purchases.","Prepare a Cash Book summary to find missing cash items (often opening/closing cash or drawings).","Then prepare the Trading and P&L Accounts and Balance Sheet in the usual way."],f:["Credit sales = Closing debtors + Cash received + Discount allowed + Returns inward + Bad debts + B/R received \u2212 Opening debtors","Credit purchases = Closing creditors + Cash paid + Discount received + Returns outward + B/P accepted \u2212 Opening creditors"]}]},17:{t:"Final Accounts of Non-Profit Organisations",sum:"Receipts & Payments, Income & Expenditure and Balance Sheet of clubs, societies and charities.",secs:[{h:"Features of NPOs",pts:["Formed for service (sports, education, charity), not for profit.","Income mainly from subscriptions, donations, grants, entrance fees, legacies.","Excess of income over expenditure is called surplus; it is added to the Capital Fund, not distributed.","Final accounts: Receipts & Payments A/c, Income & Expenditure A/c, Balance Sheet."]},{h:"Receipts & Payments vs Income & Expenditure",tbl:{head:["Basis","Receipts & Payments A/c","Income & Expenditure A/c"],rows:[["Nature","Real account \u2014 summary of cash book","Nominal account \u2014 like P&L A/c"],["Basis","Cash basis","Accrual basis"],["Items","Capital and revenue","Revenue only"],["Period","Receipts/payments of any year","Only items of the current year"],["Opening balance","Cash and bank balances","No opening balance"],["Closing balance","Cash/bank (or overdraft)","Surplus or deficit"],["Debit side","Receipts","Expenditure"],["Non-cash items","Not shown (e.g., depreciation)","Shown"]]}},{h:"Treatment of special items",tbl:{head:["Item","Treatment"],rows:[["Subscriptions","Income of the year only (adjust arrears, advances, outstanding)"],["Entrance / admission fees","Revenue, unless the rules (or question) say capitalise"],["Life membership fees","Capitalised (added to Capital Fund or a separate fund)"],["Legacies","Capitalised"],["General donations","Income (unless large and non-recurring)"],["Specific donations (e.g., for building)","Credited to that specific fund (liability)"],["Sale of old assets","Only profit/loss to I&E; book value removed from asset"],["Sale of newspapers, old sports material","Income"],["Honorarium","Expenditure (payment to non-employee)"]]},f:["Subscription income = Received during year \u2212 Received for previous year \u2212 Received in advance for next year + Outstanding for current year + Received in previous year for current year","Capital Fund (opening) = Opening assets \u2212 Opening liabilities"]}]},18:{t:"Accounting for Consignment",sum:"Consignor and consignee, commission, stock valuation, normal and abnormal loss, invoice price, del credere.",secs:[{h:"Meaning and documents",p:"In a consignment, the owner (consignor) sends goods to an agent (consignee) who sells them on the consignor\u2019s behalf and risk for a commission. Ownership remains with the consignor until sale to a third party.",pts:["Proforma invoice: statement of goods sent, sent by the consignor (often at invoice price to hide cost).","Account sales: periodical statement from the consignee showing sales, expenses, commission and balance due."]},{h:"Consignment vs sale",tbl:{head:["Basis","Consignment","Sale"],rows:[["Ownership","Remains with consignor till sale","Passes to buyer immediately"],["Relationship","Principal and agent","Seller and buyer"],["Risk","Consignor\u2019s","Buyer\u2019s"],["Unsold goods","Can be returned","Cannot be returned (except defects)"],["Expenses after dispatch","Borne by consignor","Borne by buyer"],["Document","Account sales","Invoice"]]}},{h:"Commission",pts:["Ordinary commission: % on gross sales for selling.","Del credere commission: extra % for guaranteeing collection from credit customers \u2014 bad debts are borne by the consignee.","Overriding (special) commission: extra % for selling above a fixed price or promoting new products.","Without del credere, credit sales are often recorded in a Consignment Debtors A/c and bad debts are the consignor\u2019s loss."]},{h:"Valuation of unsold stock and losses",f:["Unsold stock = (Cost + Consignor\u2019s expenses + Consignee\u2019s non-recurring expenses) \xD7 Unsold qty \xF7 Qty to which costs relate","With normal loss: cost per unit = Total cost \xF7 (Quantity \u2212 Normal loss)","Loading in stock = Stock at invoice price \xD7 Loading \xF7 (100 + Loading)"],pts:["Non-recurring expenses (freight, carriage, insurance in transit, octroi, unloading) are included; recurring expenses (godown rent, salesman salary, selling expenses) are excluded.","Normal loss (evaporation, leakage) is unavoidable: it raises the cost of the remaining units and is not recorded separately.","Abnormal loss (fire, theft, accident) is valued like stock up to the point of loss, credited to the Consignment A/c at cost; after setting off any insurance claim, the net loss goes to P&L.","Value of unsold stock must not exceed its NRV (AS 2)."]},{h:"Invoice price method",pts:["Goods sent are debited at invoice price; the loading is eliminated by crediting Consignment A/c (Goods Sent on Consignment A/c Dr / To Consignment A/c).","Unsold stock is credited at invoice price and the loading in it is reserved (Consignment A/c Dr / To Stock Reserve A/c)."],j:{title:"Main entries in the consignor\u2019s books",entries:[{date:"",dr:[["Consignment A/c",i2]],cr:[["Goods Sent on Consignment A/c",i2]],n:"Being goods sent on consignment"},{date:"",dr:[["Consignment A/c",i2]],cr:[["Bank A/c",i2]],n:"Being expenses paid by consignor"},{date:"",dr:[["Consignee\u2019s A/c",i2]],cr:[["Consignment A/c",i2]],n:"Being sales made by consignee"},{date:"",dr:[["Consignment A/c",i2]],cr:[["Consignee\u2019s A/c",i2]],n:"Being expenses and commission of consignee"},{date:"",dr:[["Stock on Consignment A/c",i2]],cr:[["Consignment A/c",i2]],n:"Being unsold stock valued"},{date:"",dr:[["Consignment A/c",i2]],cr:[["Profit & Loss A/c",i2]],n:"Being profit on consignment transferred"}]}}]},19:{t:"Accounting for Sale on Approval",sum:"Sale-or-return goods: when they become sales and how unsold ones are treated.",secs:[{h:"Meaning",p:"Goods are sent to a customer who may keep or return them within a stated period. A sale arises only when the customer signifies approval, keeps the goods beyond the time allowed, or does something that shows acceptance (AS 9). Until then the goods remain the seller\u2019s stock."},{h:"Methods of recording",pts:["When such transactions are few: record as ordinary sale; record returns; at the year end reverse the sale for goods still on approval (Sales A/c Dr / To Customer) and bring them into stock at cost (Stock with Customers A/c Dr / To Trading A/c).","When they are numerous: keep a Sale or Return Journal (memorandum) with columns for goods sent, returned and approved; pass ledger entries only for approvals.","Some firms also maintain a Sale or Return Total A/c for control."],f:["Cost of goods with customers = Selling price \xD7 100 \xF7 (100 + Mark-up %)"],j:{title:"Year-end adjustment (journal method)",entries:[{date:"",dr:[["Sales A/c",i2]],cr:[["Customer\u2019s A/c",i2]],n:"Being goods still on approval; sale reversed at selling price"},{date:"",dr:[["Stock with Customers on Approval A/c",i2]],cr:[["Trading A/c",i2]],n:"Being such goods taken into stock at cost"}]}}]},20:{t:"Sectional and Self-Balancing Ledger System",sum:"Control accounts that let each ledger be checked on its own.",secs:[{h:"Why divide the ledger?",p:"In a big business the ledger is divided into the General Ledger (real and nominal accounts, capital, cash), the Debtors\u2019 (Sales) Ledger and the Creditors\u2019 (Bought) Ledger. Control accounts make it possible to locate errors quickly and divide work among clerks."},{h:"Sectional balancing",pts:["Only the General Ledger is made to balance independently.","A Total Debtors A/c (Sales Ledger Adjustment A/c) and a Total Creditors A/c (Bought Ledger Adjustment A/c) are kept in the General Ledger.","No adjustment account is kept in the subsidiary ledgers."]},{h:"Self-balancing system",pts:["Every ledger balances by itself.","General Ledger contains Debtors\u2019 Ledger Adjustment A/c and Creditors\u2019 Ledger Adjustment A/c.","Debtors\u2019 Ledger contains a General Ledger Adjustment A/c; Creditors\u2019 Ledger contains another General Ledger Adjustment A/c.","Each pair of adjustment accounts mirrors the other.","Advantages: quick location of errors, prevention of fraud, division of work, ready totals of debtors and creditors, interim accounts."],tbl:{head:["Item","Debtors' Ledger Adj. A/c (GL)","Creditors' Ledger Adj. A/c (GL)"],rows:[["Credit sales","Debit","\u2014"],["Cash / discount / returns / bad debts / bills from debtors","Credit","\u2014"],["Bills receivable dishonoured","Debit","\u2014"],["Credit purchases","\u2014","Credit"],["Cash / discount / returns / bills to creditors","\u2014","Debit"],["Transfer from debtors\u2019 to creditors\u2019 ledger","Credit","Debit"]]},j:{title:"Transfer entries",entries:[{date:"",dr:[["Debtors' Ledger Adjustment A/c (GL)",i2]],cr:[["General Ledger Adjustment A/c (DL)",i2]],n:"Being total credit sales"},{date:"",dr:[["General Ledger Adjustment A/c (CL)",i2]],cr:[["Creditors' Ledger Adjustment A/c (GL)",i2]],n:"Being total credit purchases"}]}}]},21:{t:"Insurance Claim for Loss of Stock",sum: on:s}){return(0,V2.jsxs)("div",{className:"rounded-lg border border-dashed border-line bg-surface px-5 py-8 text-center",children:[(0,V2.jsx)("div",{className:"font-book text-[18px] font-semibold",children:e}),c?(0,V2.jsx)("p",{className:"mx-auto mt-1 max-w-[52ch] text-[14px] text-muted",children:c}):null,s?(0,V2.jsx)("div",{className:"mt-4",children:s}):null]})}var yl=e=>new Date(e).toLocaleDateString("en-IN",{day:"numeric",month:"short"}),vl=e=>`${Math.floor(e/60)}:${String(e%60).padStart(2,"0")}`;var tf=z2(B1(),1);var h3=z2(B1(),1);var s6=[{ch:1,ty:"S",m:2,q:"Define accounting.",a:"Accounting is the process of identifying, measuring, recording, classifying and summarising monetary transactions and events, and interpreting and communicating the results to users for decision making."},{ch:1,ty:"S",m:2,q:"Distinguish book-keeping from accounting in one line.",a:"Book-keeping is the recording of transactions; accounting starts where book-keeping ends and covers summarising, analysing and communicating the results."},{ch:1,ty:"S",m:2,q:"Name the fundamental qualitative characteristics of accounting information.",a:"Relevance and faithful representation. They are enhanced by comparability, verifiability, timeliness and understandability."},{ch:1,ty:"S",m:2,q:"Who are the external users of accounting information?",a:"Investors, lenders and banks, suppliers, customers, government and tax authorities, employees and their unions, researchers and the general public."},{ch:1,ty:"S",m:2,q:"State two limitations of financial accounting.",a:"It records only transactions measurable in money, ignoring qualitative factors; and it is based on historical cost, so it ignores changes in price level."},{ch:1,ty:"L",m:5,q:"Explain the qualitative characteristics of accounting information.",a:{pts:["Relevance: information is relevant if it can make a difference to users\u2019 decisions by helping them predict outcomes or confirm past expectations. Materiality is an aspect of relevance \u2014 information is material if omitting or misstating it could influence decisions.","Faithful representation: information must represent what it claims to \u2014 it should be complete, neutral (free from bias) and free from error.","Comparability: users should be able to compare the statements of one entity across years and with other entities; consistency of methods helps this.","Verifiability: different knowledgeable observers could reach consensus that the information is faithfully represented.","Timeliness: information should be available to decision-makers in time to influence their decisions.","Understandability: information should be classified and presented clearly so that a user with reasonable knowledge of business can understand it."]}},{ch:2,ty:"S",m:2,q:"What is the accounting equation?",a:"Assets = Liabilities + Capital. Every transaction affects at least two items in such a way that the equation always remains in balance."},{ch:2,ty:"S",m:2,q:"State the golden rule for a nominal account.",a:"Debit all expenses and losses; credit all incomes and gains."},{ch:2,ty:"S",m:2,q:"What is a compound journal entry?",a:"An entry in which more than one account is debited or credited, e.g. cash received from a debtor with discount allowed."},{ch:2,ty:"S",m:2,q:"Mention two errors not disclosed by a trial balance.",a:"Errors of principle (e.g., furniture debited to purchases) and compensating errors; also complete omission and posting to the wrong account on the correct side."},{ch:2,ty:"S",m:2,q:"What is meant by balancing an account?",a:"Finding the difference between the totals of the debit and credit sides, writing it on the smaller side as \u201CBalance c/d\u201D so both sides total equally, and bringing it down on the opposite side as \u201CBalance b/d\u201D."},{ch:2,ty:"L",m:5,q:"Explain the stages of the accounting cycle.",a:{pts:["Identification of transactions from source documents (vouchers, invoices).","Journalising \u2014 recording each transaction in chronological order with debit, credit and narration.","Posting \u2014 transferring entries to individual ledger accounts.","Balancing accounts and preparing the Trial Balance to check arithmetical accuracy.","Adjusting entries for outstanding, prepaid, depreciation, provisions, closing stock etc.","Preparing final accounts \u2014 Trading and Profit & Loss Account and Balance Sheet.","Closing entries \u2014 nominal accounts are closed; real and personal balances are carried forward to the next period."]}},{ch:2,ty:"D",m:5,q:"Distinguish between Journal and Ledger.",a:{tbl:{head:["Basis","Journal","Ledger"],rows:[["Nature","Book of original (prime) entry","Book of final (secondary) entry"],["Order","Chronological","Analytical \u2014 account-wise"],["Process","Journalising","Posting"],["Balance","Not balanced","Each account is balanced"],["Information","Gives full details of each transaction","Gives net position of each account"],["Trial balance","Cannot be prepared from it","Prepared from it"]]}}},{ch:3,ty:"S",m:2,q:"What is accrual basis of accounting?",a:"Revenues are recorded when earned and expenses when incurred, irrespective of when cash is received or paid."},{ch:3,ty:"S",m:2,q:"What is the mixed (hybrid) basis of accounting?",a:"A combination of cash and accrual bases \u2014 e.g., expenses on accrual basis but some uncertain incomes on cash basis."},{ch:3,ty:"S",m:2,q:"Which basis of accounting must companies follow in India?",a:"Accrual basis and double entry, as required by Section 128 of the Companies Act, 2013."},{ch:3,ty:"D",m:5,q:"Distinguish between cash basis and accrual basis of accounting.",a:{tbl:{head:["Basis","Cash basis","Accrual basis"],rows:[["Recording","When cash is received or paid","When revenue is earned or expense incurred"],["Outstanding / prepaid items","Not recorded","Recorded"],["Profit","May not be true and fair","True and fair"],["Matching","Not followed","Followed"],["Suitability","Small professionals","All businesses; compulsory for companies"],["Estimates","None","Depreciation, provisions etc."]]}}},{ch:4,ty:"S",m:2,q:"What is the going concern concept?",a:"The assumption that the business will continue to operate for the foreseeable future, so assets are shown at cost less depreciation rather than at forced-sale value."},{ch:4,ty:"S",m:2,q:"Explain the business entity concept.",a:"The business is treated as separate from its owner; so capital is a liability of the business to the owner and the owner\u2019s private expenses are drawings."},{ch:4,ty:"S",m:2,q:"What does the convention of conservatism require?",a:"Anticipate no profit but provide for all possible losses \u2014 e.g., closing stock at cost or market price, whichever is lower; provision for doubtful debts."},{ch:4,ty:"S",m:2,q:"State the matching concept.",a:"Expenses of a period should be set against the revenues of the same period to ascertain the profit correctly."},{ch:4,ty:"S",m:2,q:"Name the fundamental accounting assumptions under AS 1.",a:"Going concern, consistency and accrual. No disclosure is needed if they are followed; if not followed, the fact must be disclosed."},{ch:4,ty:"S",m:2,q:"What is the materiality convention?",a:"Items whose omission or misstatement would not influence users\u2019 decisions may be treated in a simple way, e.g., a small tool charged to expenses."},{ch:4,ty:"L",m:10,q:"Explain the important accounting concepts and conventions with examples.",a:{pts:["Business entity \u2014 business separate from owner (capital shown as liability).","Money measurement \u2014 only money-measurable events are recorded.","Going concern \u2014 assets at cost less depreciation, not break-up value.","Accounting period \u2014 results reported periodically (annually).","Cost concept \u2014 assets recorded at cost of acquisition.","Dual aspect \u2014 every debit has an equal credit (A = L + C).","Realisation \u2014 revenue recognised when goods are delivered or services rendered.","Accrual and matching \u2014 revenues and related expenses of the same period are compared.","Consistency \u2014 same policies year after year; changes disclosed.","Conservatism \u2014 provide for losses, do not anticipate profits.","Materiality \u2014 insignificant items treated simply.","Full disclosure \u2014 all significant information, including notes and policies, disclosed."]}},{ch:5,ty:"S",m:2,q:"Define revenue as per AS 9.",a:"The gross inflow of cash, receivables or other consideration arising in the ordinary course of activities from sale of goods, rendering of services, and use of enterprise resources by others yielding interest, royalties and dividends."},{ch:5,ty:"S",m:2,q:"When is revenue from sale of goods recognised under AS 9?",a:"When significant risks and rewards of ownership have been transferred to the buyer and there is no significant uncertainty about the amount of consideration."},{ch:5,ty:"S",m:2,q:"How is interest and dividend income recognised under AS 9?",a:"Interest on a time-proportion basis; dividends when the owner\u2019s right to receive payment is established."},{ch:5,ty:"S",m:2,q:"State the five steps of Ind AS 115.",a:"Identify the contract; identify performance obligations; determine the transaction price; allocate it to the obligations; recognise revenue when each obligation is satisfied (control transfers)."},{ch:5,ty:"L",m:5,q:"Discuss the timing of revenue recognition with examples.",a:{pts:["Sale of goods: on transfer of significant risks and rewards \u2014 usually on delivery.","Rendering of services: proportionate completion method (as work progresses) or completed service contract method.","Interest: time-proportion basis; royalties: accrual basis per agreement; dividends: when right to receive is established.","Uncertainty: if collection is uncertain at the time of sale, revenue is postponed until it is reasonably certain.","Sale on approval: on acceptance by buyer or expiry of approval period.","Consignment: when the consignee sells to third parties, not on dispatch.","Advance received: a liability until goods are delivered."]}},{ch:6,ty:"S",m:2,q:"How are inventories valued under AS 2?",a:"At the lower of cost and net realisable value, compared item by item."},{ch:6,ty:"S",m:2,q:"What is net realisable value?",a:"Estimated selling price in the ordinary course of business less the estimated costs of completion and the estimated costs necessary to make the sale."},{ch:6,ty:"S",m:2,q:"Which cost formulas are permitted by AS 2?",a:"FIFO and weighted average cost; specific identification for items that are not ordinarily interchangeable. LIFO is not permitted."},{ch:6,ty:"S",m:2,q:"Give two costs excluded from the cost of inventory.",a:"Abnormal wastage of materials and labour; selling and distribution costs (also storage costs not necessary for production, and administrative overheads unrelated to production)."},{ch:6,ty:"S",m:2,q:"Why does closing stock affect the profit of two years?",a:"It is credited to the Trading Account of the current year and becomes the opening stock (debit) of the next year, so an error in it affects both years\u2019 profits in opposite directions."},{ch:6,ty:"D",m:5,q:"Distinguish between FIFO and Weighted Average methods.",a:{tbl:{head:["Basis","FIFO","Weighted average"],rows:[["Pricing of issues","Earliest purchase price first","Average rate after each receipt"],["Closing stock (rising prices)","At latest prices \u2014 higher","Moderate"],["Profit (rising prices)","Higher","Moderate"],["Calculation","Simple but layered","Rate recalculated after every receipt"],["Price fluctuations","Reflected in cost of issues in stages","Smoothed out"]]}}},{ch:7,ty:"S",m:2,q:"Define depreciation.",a:"The systematic allocation of the depreciable amount (cost less residual value) of an asset over its useful life."},{ch:7,ty:"S",m:2,q:"State the causes of depreciation.",a:"Wear and tear due to use, passage of time, obsolescence, depletion and accidents."},{ch:7,ty:"S",m:2,q:"How is a change in method of depreciation treated under revised AS 10?",a:"As a change in accounting estimate \u2014 applied prospectively from the date of change, with disclosure as per AS 5."},{ch:7,ty:"S",m:2,q:"Why is depreciation called a non-cash expense?",a:"Because no cash goes out when it is charged; it only allocates the cost already paid for the asset."},{ch:7,ty:"S",m:2,q:"What are the factors for computing depreciation?",a:"Cost of the asset, estimated useful life, estimated residual value and the expected pattern of consumption of benefits."},{ch:7,ty:"D",m:5,q:"Distinguish between Straight Line Method and Written Down Value Method of depreciation.",a:{tbl:{head:["Basis","SLM","WDV"],rows:[["Base","Original cost","Opening book value each year"],["Amount","Same every year","Decreases every year"],["Book value","Can become zero","Never zero"],["Repairs + depreciation","Increases over time","Fairly equal"],["Suitability","Assets with fixed life (lease, patent)","Plant and machinery"],["Calculation","Easy","Comparatively difficult"]]}}},{ch:7,ty:"L",m:5,q:"Explain the provision for depreciation method and its advantages.",a:{pts:["Depreciation is credited to a Provision for Depreciation A/c instead of the asset account; the asset continues at original cost.","Entry: Depreciation A/c Dr / To Provision for Depreciation A/c; Depreciation is then closed to P&L.","In the Balance Sheet, accumulated depreciation is deducted from the cost of the asset.","On sale, cost and accumulated depreciation are transferred to an Asset Disposal A/c to find profit or loss.","Advantages: original cost and total depreciation are both visible, helping replacement planning and compliance with disclosure requirements."]}},{ch:8,ty:"S",m:2,q:"What is a provision?",a:"An amount charged against profit to provide for a known liability or a fall in asset value whose exact amount cannot be determined with substantial accuracy."},{ch:8,ty:"S",m:2,q:"What is a capital reserve?",a:"A reserve created out of capital profits, such as profit on sale of fixed assets or securities premium; generally not available for dividend."},{ch:8,ty:"S",m:2,q:"What is a secret reserve?",a:"A reserve not shown in the Balance Sheet, created by under-valuing assets or over-valuing liabilities (e.g., excessive depreciation)."},{ch:8,ty:"D",m:5,q:"Distinguish between reserve and provision.",a:{tbl:{head:["Basis","Provision","Reserve"],rows:[["Nature","Charge against profit","Appropriation of profit"],["Object","Meet a known liability or loss","Strengthen financial position"],["Creation","Even in a loss year","Only when there is profit"],["Presentation","Deducted from asset / shown as liability","Under Reserves & Surplus"],["Dividend","Cannot be used","Revenue reserve can be used"],["Effect on profit","Reduces net profit","Reduces divisible profit only"]]}}},{ch:9,ty:"S",m:2,q:"How is the provision for doubtful debts calculated?",a:"As a percentage of good debtors, i.e., debtors after deducting further bad debts."},{ch:9,ty:"S",m:2,q:"How is bad debts recovered recorded?",a:"Cash/Bank A/c Dr / To Bad Debts Recovered A/c; it is credited to the P&L A/c as income, not to the debtor\u2019s account."},{ch:9,ty:"S",m:2,q:"On what amount is provision for discount on debtors calculated?",a:"On debtors after deducting further bad debts and the provision for doubtful debts."},{ch:9,ty:"S",m:2,q:"What happens if the old provision is more than required?",a:"The excess is written back by crediting the Profit & Loss A/c (or reducing the charge for bad debts)."},{ch:10,ty:"S",m:2,q:"What is capital expenditure?",a:"Expenditure that acquires or improves a fixed asset or increases earning capacity, with benefits lasting more than one accounting year."},{ch:10,ty:"S",m:2,q:"What is deferred revenue expenditure?",a:"Expenditure revenue in nature whose benefit was traditionally spread over a few years, such as heavy advertising for a new product; current standards generally require it to be expensed."},{ch:10,ty:"S",m:2,q:"Is wages paid for installation of machinery capital or revenue?",a:"Capital expenditure \u2014 it is part of the cost of bringing the machine to working condition."},{ch:10,ty:"S",m:2,q:"Give two examples of capital receipts.",a:"Capital introduced by the owner, loans raised, and sale proceeds of fixed assets."},{ch:10,ty:"D",m:5,q:"Distinguish between capital expenditure and revenue expenditure.",a:{tbl:{head:["Basis","Capital expenditure","Revenue expenditure"],rows:[["Purpose","Acquire/improve fixed assets","Maintain the business"],["Benefit","More than one year","Within the year"],["Nature","Non-recurring","Recurring"],["Shown in","Balance Sheet (asset)","Trading / P&L A/c"],["Earning capacity","Increases it","Maintains it"],["Example","Machinery and its installation","Repairs, wages, rent"]]}}},{ch:11,ty:"S",m:2,q:"Why is each adjustment shown twice in final accounts?",a:"Because an adjustment is a journal entry with a debit and a credit, each affecting a different statement (e.g., expense in P&L and liability in the Balance Sheet)."},{ch:11,ty:"S",m:2,q:"Give the adjusting entry for goods taken by the proprietor for personal use.",a:"Drawings A/c Dr / To Purchases A/c (at cost)."},{ch:11,ty:"S",m:2,q:"How is manager\u2019s commission on net profit after charging such commission calculated?",a:"Net profit before commission \xD7 Rate \xF7 (100 + Rate)."},{ch:11,ty:"S",m:2,q:"How is goods lost by fire with partial insurance claim shown?",a:"Full cost credited to Trading A/c; claim admitted shown as an asset; the uninsured part debited to P&L A/c."},{ch:11,ty:"L",m:5,q:"Explain the treatment of (i) outstanding expenses, (ii) prepaid expenses, (iii) accrued income and (iv) income received in advance.",a:{pts:["Outstanding expenses: added to the expense in Trading/P&L; shown as a liability. Entry: Expense A/c Dr / To Outstanding Expense A/c.","Prepaid expenses: deducted from the expense; shown as an asset. Entry: Prepaid Expense A/c Dr / To Expense A/c.","Accrued income: added to the income in P&L; shown as an asset. Entry: Accrued Income A/c Dr / To Income A/c.","Income received in advance: deducted from income; shown as a liability. Entry: Income A/c Dr / To Income Received in Advance A/c."]}},{ch:12,ty:"S",m:2,q:"What is a suspense account?",a:"A temporary account to which the difference in the Trial Balance is transferred until the errors causing it are located and rectified."},{ch:12,ty:"S",m:2,q:"What is an error of principle?",a:"An error from violating accounting principles \u2014 treating capital expenditure as revenue or vice versa, e.g., purchase of furniture debited to Purchases A/c."},{ch:12,ty:"S",m:2,q:"What is a compensating error?",a:"Two or more errors whose effects cancel out, so the Trial Balance still agrees."},{ch:12,ty:"S",m:2,q:"How are errors rectified after final accounts are prepared?",a:"Corrections affecting nominal accounts are made through a Profit & Loss Adjustment A/c, because nominal accounts are already closed."},{ch:12,ty:"L",m:5,q:"Classify errors and state which of them affect the Trial Balance.",a:{pts:["Errors of omission \u2014 complete (not affecting TB) and partial (affecting TB).","Errors of commission \u2014 wrong posting, wrong totalling (casting), wrong balancing, carry-forward errors, wrong side posting; most affect the TB, but posting to a wrong account on the correct side does not.","Errors of principle \u2014 do not affect the TB.","Compensating errors \u2014 do not affect the TB.","One-sided errors affect the TB and are rectified through Suspense A/c; two-sided errors are rectified by a normal journal entry."]}},{ch:13,ty:"S",m:2,q:"What are accounting standards?",a:"Written policy documents issued by an expert body covering recognition, measurement, presentation and disclosure of transactions in financial statements."},{ch:13,ty:"S",m:2,q:"When was the Accounting Standards Board of ICAI constituted?",a:"On 21st April 1977."},{ch:13,ty:"S",m:2,q:"What is IFRS?",a:"International Financial Reporting Standards issued by the International Accounting Standards Board (IASB), used as a global accounting language."},{ch:13,ty:"S",m:2,q:"What is Ind AS?",a:"Indian Accounting Standards converged with IFRS, notified by the Central Government through the Companies (Indian Accounting Standards) Rules, 2015."},{ch:13,ty:"L",m:5,q:"Describe the procedure for issuing accounting standards in India.",a:{pts:["ASB of ICAI identifies areas needing standards.","Study groups prepare a preliminary draft.","The draft goes to ICAI Council members and specified bodies (MCA, C&AG, SEBI, RBI, CBDT, chambers of commerce, etc.); ASB discusses with their representatives.","An Exposure Draft is issued for public comments.","ASB finalises the draft after considering comments and submits it to the Council of ICAI.","The Council may modify it in consultation with ASB and issues the standard.","For companies, the Central Government notifies the standard under Section 133 of the Companies Act, 2013 in consultation with NFRA."]}},{ch:13,ty:"L",m:5,q:"State the benefits of accounting standards and the need for global standards.",a:{pts:["Uniformity and comparability of financial statements.","Reduce alternative treatments and creative accounting.","Increase credibility; help auditors and regulators.","Global need: cross-border investment, multinational groups, foreign listings and lower cost of capital require one financial language \u2014 hence IFRS and India\u2019s convergence through Ind AS."]}},{ch:14,ty:"S",m:2,q:"What is GAAP?",a:"Generally Accepted Accounting Principles \u2014 the concepts, conventions, rules and procedures commonly accepted for preparing financial statements."},{ch:14,ty:"S",m:2,q:"What is physical capital maintenance?",a:"A concept under which profit arises only if the physical productive (operating) capacity at the end exceeds that at the beginning; it requires current cost measurement."},{ch:14,ty:"S",m:2,q:"Define fair value as per Ind AS 113.",a:"The price that would be received to sell an asset or paid to transfer a liability in an orderly transaction between market participants at the measurement date (an exit price)."},{ch:14,ty:"S",m:2,q:"State two limitations of historical cost accounting.",a:"It ignores changes in price levels (understating assets and overstating profit in inflation) and mixes rupees of different years, reducing comparability."},{ch:14,ty:"L",m:5,q:"Explain the concepts of capital maintenance.",a:{pts:["Profit can be measured only after capital is maintained.","Financial capital maintenance (money): profit if money value of net assets at the end exceeds that at the beginning (after owner transactions).","Financial capital maintenance (constant purchasing power): opening capital is restated for general inflation before comparison.","Physical capital maintenance: profit only if operating capacity at the end exceeds that at the beginning; price changes on assets are capital maintenance adjustments, not profit.","Choice affects measurement basis \u2014 historical cost goes with nominal financial capital; current cost with physical capital."]}},{ch:15,ty:"S",m:2,q:"Where is carriage inwards shown?",a:"On the debit side of the Trading Account, as a direct expense."},{ch:15,ty:"S",m:2,q:"What is marshalling of a Balance Sheet?",a:"The order in which assets and liabilities are arranged \u2014 order of liquidity or order of permanence."},{ch:15,ty:"S",m:2,q:"What is cost of goods sold?",a:"Opening stock + net purchases + direct expenses \u2212 closing stock."},{ch:15,ty:"S",m:2,q:"Why is Trading Account prepared?",a:"To find gross profit or gross loss from buying and selling \u2014 the result of the main trading activity."},{ch:15,ty:"D",m:5,q:"Distinguish between Trading Account and Profit & Loss Account.",a:{tbl:{head:["Basis","Trading A/c","Profit & Loss A/c"],rows:[["Result","Gross profit / loss","Net profit / loss"],["Expenses","Direct expenses","Indirect expenses"],["Stage","First stage","Second stage"],["Starts with","Opening stock","Gross profit b/d"],["Purpose","Efficiency of trading","Overall profitability"]]}}},{ch:16,ty:"S",m:2,q:"What is a Statement of Affairs?",a:"A statement of assets and liabilities on a date, prepared from incomplete records, in which capital is the balancing figure."},{ch:16,ty:"S",m:2,q:"How is profit found under the Statement of Affairs method?",a:"Closing capital + drawings \u2212 additional capital \u2212 opening capital."},{ch:16,ty:"S",m:2,q:"How are credit sales found under incomplete records?",a:"As the balancing figure of the Total Debtors Account."},{ch:16,ty:"D",m:5,q:"Distinguish between single entry and double entry system.",a:{tbl:{head:["Basis","Single entry","Double entry"],rows:[["Recording","Incomplete \u2014 often only cash and personal accounts","Both aspects of every transaction"],["Trial balance","Cannot be prepared","Can be prepared"],["Profit","Estimated by capital comparison","From Trading and P&L A/c"],["Financial position","Statement of Affairs (estimate)","Balance Sheet (reliable)"],["Acceptability","Not accepted by law for companies","Accepted"],["Suitability","Small traders","All businesses"]]}}},{ch:16,ty:"D",m:5,q:"Distinguish between Statement of Affairs and Balance Sheet.",a:{tbl:{head:["Basis","Statement of Affairs","Balance Sheet"],rows:[["Basis","Incomplete records, estimates","Ledger balances"],["Capital","Balancing figure","From Capital A/c"],["Object","Find capital","Show financial position"],["Reliability","Less","More"],["Omission of items","Not easily detected","Detected through accounts"]]}}},{ch:17,ty:"S",m:2,q:"What is a Receipts and Payments Account?",a:"A summary of the cash book of a non-profit organisation, showing all receipts and payments of the year (capital and revenue, of any period) with opening and closing cash/bank balances."},{ch:17,ty:"S",m:2,q:"How is a legacy treated?",a:"It is capitalised \u2014 added to the Capital Fund in the Balance Sheet."},{ch:17,ty:"S",m:2,q:"What is the Capital Fund?",a:"The excess of assets over liabilities of a non-profit organisation; it is built up by surpluses and capitalised receipts."},{ch:17,ty:"S",m:2,q:"How are specific donations treated?",a:"Credited to the specific fund concerned and shown on the liabilities side; not treated as income."},{ch:17,ty:"S",m:2,q:"How are life membership fees treated?",a:"Capitalised \u2014 credited to the Capital Fund or a Life Membership Fund."},{ch:17,ty:"D",m:5,q:"Distinguish between Receipts and Payments Account and Income and Expenditure Account.",a:{tbl:{head:["Basis","Receipts & Payments A/c","Income & Expenditure A/c"],rows:[["Nature","Real account","Nominal account"],["Basis","Cash","Accrual"],["Items","Capital and revenue","Revenue only"],["Period","Any year","Current year only"],["Opening balance","Cash/bank balance","None"],["Closing balance","Cash in hand / at bank","Surplus or deficit"],["Non-cash items","Not shown","Shown (depreciation)"]]}}},{ch:17,ty:"L",m:5,q:"How will you treat subscriptions in the accounts of a club?",a:{pts:["Total subscriptions received appear in the Receipts & Payments A/c, often split by year.","Only the subscription for the current year is income: deduct arrears of previous years and advances for next year; add outstanding for the current year and subscription received in advance last year for this year.","Outstanding subscriptions are shown as an asset; subscriptions received in advance as a liability.","Alternatively, prepare a Subscription Account whose balancing figure is the income."]}},{ch:18,ty:"S",m:2,q:"What is a proforma invoice?",a:"A statement sent by the consignor to the consignee giving details of goods sent (quantity, price, expenses); it is not a demand for payment."},{ch:18,ty:"S",m:2,q:"What is account sales?",a:"A periodical statement sent by the consignee to the consignor showing goods sold, expenses incurred, commission and the balance due."},{ch:18,ty:"S",m:2,q:"What is del credere commission?",a:"Additional commission paid to the consignee for guaranteeing collection from credit customers; bad debts are then borne by the consignee."},{ch:18,ty:"S",m:2,q:"Which expenses are included in valuing unsold consignment stock?",a:"Consignor\u2019s expenses and the consignee\u2019s non-recurring expenses (freight, carriage, octroi, unloading) \u2014 proportionately; recurring selling expenses are excluded."},{ch:18,ty:"S",m:2,q:"How is abnormal loss treated in consignment?",a:"Valued like stock (cost + proportionate expenses incurred up to the loss), credited to the Consignment A/c; the net loss after insurance claim is charged to P&L."},{ch:18,ty:"S",m:2,q:"How is normal loss treated in consignment?",a:"It is not recorded separately; the total cost is spread over the remaining good units, raising their cost per unit."},{ch:18,ty:"S",m:2,q:"Why are goods sent at invoice price?",a:"To keep the cost price secret from the consignee and to control the minimum selling price."},{ch:18,ty:"D",m:5,q:"Distinguish between consignment and sale.",a:{tbl:{head:["Basis","Consignment","Sale"],rows:[["Ownership","Stays with consignor","Passes to buyer"],["Relation","Principal\u2013agent","Seller\u2013buyer"],["Risk","Consignor bears","Buyer bears"],["Return of goods","Unsold goods returnable","Not returnable"],["Expenses after dispatch","Consignor bears","Buyer bears"],["Statement","Account sales","Invoice"]]}}},{ch:18,ty:"L",m:5,q:"Explain the treatment of normal and abnormal loss in consignment accounts.",a:{pts:["Normal loss arises from the nature of goods (evaporation, leakage, drying) and cannot be avoided.","It is absorbed by good units: cost per unit = total cost \xF7 (quantity \u2212 normal loss); no entry is passed.","Abnormal loss arises from accidents, fire or theft and is avoidable.","It is valued at cost plus proportionate expenses incurred up to the point of loss (consignee\u2019s expenses are included only if the loss occurs after they are incurred).","Entry: Abnormal Loss A/c Dr / To Consignment A/c; insurance claim: Bank A/c Dr / To Abnormal Loss A/c; balance: P&L A/c Dr / To Abnormal Loss A/c.","This keeps the normal profit of the consignment undistorted."]}},{ch:19,ty:"S",m:2,q:"When does goods sent on sale or return become a sale?",a:"When the buyer signifies approval, retains the goods beyond the approval period, or acts in a way that shows acceptance."},{ch:19,ty:"S",m:2,q:"How are goods on approval treated at the year end?",a:"Sale is reversed at selling price for goods still within the approval period, and the goods are included in closing stock at cost."},{ch:19,ty:"S",m:2,q:"What is a Sale or Return Journal?",a:"A memorandum book with columns for goods sent, returned and approved, used when goods are frequently sent on approval; only approvals are posted to the ledger."},{ch:19,ty:"L",m:5,q:"Explain the methods of recording sale on approval transactions.",a:{pts:["When transactions are few: treat goods sent as sales; record returns; at year end pass reversing entries for goods still on approval and bring them into stock at cost.","When transactions are many: maintain a Sale or Return Journal (memorandum) and post only approvals to customers\u2019 accounts; returns need no ledger entry.","A Sale or Return Total A/c may be maintained for control.","At the year end under every method, goods with customers are shown as stock at cost (or NRV if lower), not as debtors."]}},{ch:20,ty:"S",m:2,q:"What is a self-balancing ledger?",a:"A ledger that can be balanced independently because it contains an adjustment account representing the other ledgers."},{ch:20,ty:"S",m:2,q:"What is sectional balancing?",a:"A system in which only the General Ledger is balanced independently, using Total Debtors and Total Creditors Accounts."},{ch:20,ty:"S",m:2,q:"What is a General Ledger Adjustment Account?",a:"An account opened in the Debtors\u2019 or Creditors\u2019 Ledger to complete the double entry within that ledger; it mirrors the corresponding control account in the General Ledger."},{ch:20,ty:"S",m:2,q:"Give two advantages of the self-balancing system.",a:"Errors can be located quickly in the ledger concerned, and fraud is checked because work is divided among clerks."},{ch:20,ty:"D",m:5,q:"Distinguish between sectional balancing and self-balancing system.",a:{tbl:{head:["Basis","Sectional balancing","Self-balancing"],rows:[["Ledgers balanced","Only General Ledger","Every ledger"],["Adjustment accounts","Only in General Ledger","In all ledgers"],["Double entry","Not complete in subsidiary ledgers","Complete in each ledger"],["Location of errors","Less effective","Easier"],["Suitability","Medium firms","Large firms"]]}}},{ch:21,ty:"S",m:2,q:"What is the average clause in a fire policy?",a:"A clause by which, if stock is under-insured, the insurer pays only the proportion of loss that the sum insured bears to the value of stock on the date of fire."},{ch:21,ty:"S",m:2,q:"Why is a Memorandum Trading Account prepared?",a:"To estimate the value of stock on the date of fire using the normal gross profit rate, since stock records are usually destroyed."},{ch:21,ty:"S",m:2,q:"How are poor-selling (abnormal) items handled in a loss of stock claim?",a:"They are shown in a separate column of the Memorandum Trading Account so that the normal GP rate is applied only to normal goods."},{ch:21,ty:"S",m:2,q:"What is salvage?",a:"Goods saved from the fire; their value is deducted from stock on the date of fire to find the loss."},{ch:21,ty:"L",m:5,q:"Explain the steps in computing a claim for loss of stock.",a:{pts:["Find the normal rate of gross profit from past years\u2019 Trading Accounts, adjusting for abnormal items.","Prepare a Memorandum Trading A/c from the last accounting date to the date of fire; adjust purchases and sales for unrecorded items, goods on approval, etc.","Find stock on the date of fire as the balancing figure (normal and abnormal goods separately if needed).","Deduct salvage to find the loss of stock.","If the policy has an average clause and the sum insured is less than the stock, claim = loss \xD7 sum insured \xF7 stock; otherwise claim = loss (up to the sum insured)."]}},{ch:22,ty:"S",m:2,q:"What is the indemnity period?",a:"The period beginning with the damage during which the business results are affected, not exceeding the period stated in the policy."},{ch:22,ty:"S",m:2,q:"How is the rate of gross profit computed in a loss of profit claim?",a:"(Net profit + insured standing charges) \xF7 turnover of the last financial year \xD7 100."},{ch:22,ty:"S",m:2,q:"What are short sales?",a:"The reduction in turnover during the indemnity period compared with the standard turnover adjusted for trend."},{ch:22,ty:"S",m:2,q:"What are standing charges?",a:"Fixed expenses that continue even when the business is interrupted \u2014 rent, salaries, interest, insurance, etc."},{ch:22,ty:"S",m:2,q:"What limits the claim for increased cost of working?",a:"The least of the actual extra expense, the GP on sales generated by it, and the economic limit (expense \xD7 insured GP \xF7 (NP + all standing charges))."},{ch:22,ty:"L",m:10,q:"Explain the procedure for computing a claim for loss of profit.",a:{pts:["Rate of GP = (NP + insured standing charges) \xF7 turnover of last financial year.","Short sales = standard turnover (adjusted for trend) \u2212 actual turnover during indemnity period.","Loss of GP = short sales \xD7 rate of GP.","Add admissible increased cost of working \u2014 the least of actual expense, GP on turnover it generated, and the economic limit when some standing charges are uninsured.","Less savings in insured standing charges during the indemnity period.","Insurable amount = rate of GP \xD7 adjusted annual turnover (12 months before damage).","If the sum insured is less than the insurable amount, apply average: claim \xD7 sum insured \xF7 insurable amount."]}}];var o1=z2(B1(),1);var e1=z2(B1(),1);var N=z2(_2(),1),F8=(0,e1.createContext)(null),
